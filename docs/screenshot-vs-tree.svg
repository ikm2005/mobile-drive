<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Screenshot loop vs accessibility tree: adding an item in a three-screen app</title>
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <g id="phone">
      <rect x="0" y="0" width="110" height="190" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <rect x="40" y="6" width="30" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
  </defs>

  <rect width="1000" height="650" fill="#f8fafc"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">Same task, two ways: add an item in a three-screen app</text>

  <!-- ============ Lane A: screenshot loop ============ -->
  <rect x="20" y="56" width="960" height="276" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="20" y="56" width="6" height="276" rx="3" fill="#c2410c"/>
  <text x="44" y="84" font-size="16" font-weight="700" fill="#c2410c">Screenshot loop</text>
  <text x="44" y="103" font-size="12.5" fill="#475569">the model reads pixels and guesses where to tap</text>

  <!-- phone 1: list -->
  <g transform="translate(85,118)">
    <use href="#phone"/>
    <text x="12" y="32" font-size="11" font-weight="700" fill="#0f172a">Items</text>
    <rect x="10" y="42" width="90" height="18" rx="3" fill="#e2e8f0"/>
    <rect x="10" y="64" width="90" height="18" rx="3" fill="#e2e8f0"/>
    <rect x="10" y="86" width="90" height="18" rx="3" fill="#e2e8f0"/>
    <circle cx="86" cy="150" r="11" fill="#64748b"/>
    <text x="86" y="154.5" font-size="14" fill="#ffffff" text-anchor="middle">+</text>
    <rect x="0" y="170" width="110" height="20" rx="0" fill="#f1f5f9"/>
    <circle cx="88" cy="148" r="16" fill="none" stroke="#c2410c" stroke-width="2"/>
    <path d="M88,128 v8 M88,160 v8 M68,148 h8 M100,148 h8" stroke="#c2410c" stroke-width="2"/>
  </g>
  <!-- phone 2: form, missed tap -->
  <g transform="translate(345,118)">
    <use href="#phone"/>
    <text x="12" y="32" font-size="11" font-weight="700" fill="#0f172a">New item</text>
    <text x="12" y="50" font-size="8.5" fill="#64748b">Name</text>
    <rect x="10" y="54" width="90" height="16" rx="3" fill="none" stroke="#94a3b8"/>
    <text x="12" y="84" font-size="8.5" fill="#64748b">Quantity</text>
    <rect x="10" y="88" width="90" height="16" rx="3" fill="none" stroke="#94a3b8"/>
    <rect x="30" y="140" width="50" height="20" rx="10" fill="#cbd5e1"/>
    <text x="55" y="153.5" font-size="9" fill="#475569" text-anchor="middle">Save</text>
    <circle cx="70" cy="126" r="13" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="70" y="130.5" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">✕</text>
  </g>
  <!-- phone 3: list with the new item -->
  <g transform="translate(605,118)">
    <use href="#phone"/>
    <text x="12" y="32" font-size="11" font-weight="700" fill="#0f172a">Items</text>
    <rect x="10" y="42" width="90" height="18" rx="3" fill="#bbf7d0"/>
    <text x="15" y="54.5" font-size="8.5" fill="#065f46">Sample item</text>
    <rect x="10" y="64" width="90" height="18" rx="3" fill="#e2e8f0"/>
    <rect x="10" y="86" width="90" height="18" rx="3" fill="#e2e8f0"/>
    <circle cx="86" cy="150" r="11" fill="#64748b"/>
    <text x="86" y="154.5" font-size="14" fill="#ffffff" text-anchor="middle">+</text>
    <rect x="0" y="170" width="110" height="20" fill="#f1f5f9"/>
  </g>

  <!-- arrows lane A -->
  <line x1="203" y1="200" x2="337" y2="200" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="270" y="188" font-size="11.5" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">tap (540, 1980)?</text>
  <line x1="463" y1="200" x2="597" y2="200" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="530" y="176" font-size="11.5" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">tap (310, 860)?</text>
  <text x="530" y="191" font-size="11" fill="#c2410c" text-anchor="middle">missed → re-shoot → retry</text>

  <!-- screenshot cost badges -->
  <g font-size="11.5" text-anchor="middle" fill="#7c2d12">
    <text x="140" y="324">📷 ≈ 3,300 tokens</text>
    <text x="400" y="324">📷 📷 ≈ 6,600 tokens</text>
    <text x="660" y="324">📷 ≈ 3,300 tokens</text>
  </g>

  <!-- summary A -->
  <rect x="770" y="118" width="190" height="190" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="786" y="146" font-size="13" font-weight="700" fill="#9a3412">Cost of this path</text>
  <text x="786" y="172" font-size="12.5" fill="#0f172a">4 screenshots</text>
  <text x="786" y="192" font-size="12.5" fill="#0f172a">≈ 13,200 image tokens</text>
  <text x="786" y="212" font-size="12.5" fill="#0f172a">7 calls (4 shots + 3 taps)</text>
  <text x="786" y="240" font-size="11.5" fill="#7c2d12">Every image stays in the</text>
  <text x="786" y="256" font-size="11.5" fill="#7c2d12">context and is re-sent on</text>
  <text x="786" y="272" font-size="11.5" fill="#7c2d12">every later call.</text>

  <!-- ============ Lane B: accessibility tree ============ -->
  <rect x="20" y="346" width="960" height="262" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="20" y="346" width="6" height="262" rx="3" fill="#047857"/>
  <text x="44" y="374" font-size="16" font-weight="700" fill="#047857">Accessibility tree (mobile-drive)</text>
  <text x="44" y="393" font-size="12.5" fill="#475569">the model reads text with tappable refs and acts on them; the OS provides the tree</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="10.5">
    <!-- card 1 -->
    <rect x="40" y="408" width="200" height="112" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="50" y="426" font-weight="700" fill="#065f46">snapshot -i</text><text x="230" y="426" text-anchor="end" fill="#047857">≈250 tok</text>
    <text x="50" y="446" fill="#0f172a">@e3  tab "Items"</text>
    <text x="50" y="463" fill="#0f172a">@e7  button id=item_add</text>
    <text x="50" y="480" fill="#0f172a">@e9  row "Milk"</text>
    <text x="50" y="497" fill="#0f172a">@e10 row "Bread"</text>
    <!-- card 2 -->
    <rect x="300" y="408" width="200" height="112" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="310" y="426" font-weight="700" fill="#065f46">--settle diff</text><text x="490" y="426" text-anchor="end" fill="#047857">≈200 tok</text>
    <text x="310" y="446" fill="#0f172a">@e12 field id=item_name</text>
    <text x="310" y="463" fill="#0f172a">@e13 field id=item_quantity</text>
    <text x="310" y="480" fill="#0f172a">@e15 button "Save"</text>
    <text x="310" y="497" fill="#64748b">     (disabled until Name)</text>
    <!-- card 3 -->
    <rect x="560" y="408" width="200" height="112" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="570" y="426" font-weight="700" fill="#065f46">--settle diff</text><text x="750" y="426" text-anchor="end" fill="#047857">≈150 tok</text>
    <text x="570" y="446" fill="#0f172a">@e7  button id=item_add</text>
    <text x="570" y="463" fill="#0f172a">@e20 row "Sample item"</text>
    <text x="570" y="489" fill="#065f46">wait 'label="Sample</text>
    <text x="570" y="505" fill="#065f46">      item"'   ✓ PASS</text>
  </g>

  <!-- arrows lane B -->
  <line x1="244" y1="464" x2="294" y2="464" stroke="#047857" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="504" y1="464" x2="554" y2="464" stroke="#047857" stroke-width="2" marker-end="url(#arrB)"/>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="269" cy="448" r="9" fill="#047857"/><text x="269" y="452">1</text>
    <circle cx="529" cy="448" r="9" fill="#047857"/><text x="529" y="452">2</text>
  </g>
  <g font-size="11.5" fill="#0f172a">
    <circle cx="50" cy="545" r="8" fill="#047857"/><text x="50" y="549" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
    <text x="64" y="549" font-family="ui-monospace, Menlo, monospace" font-size="10.5">press @e7 --settle</text>
    <text x="200" y="549" fill="#047857">1 call: tap Add by its ref, get back only what changed</text>
    <circle cx="50" cy="571" r="8" fill="#047857"/><text x="50" y="575" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
    <text x="64" y="575" font-family="ui-monospace, Menlo, monospace" font-size="10.5">fill @e12 "Sample item" &amp;&amp; fill @e13 2 &amp;&amp; press @e15 --settle &amp;&amp; wait …</text>
    <text x="64" y="592" fill="#047857">1 call: every predictable step of the form chained, verified once at the end</text>
  </g>

  <!-- summary B -->
  <rect x="770" y="408" width="190" height="192" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="786" y="436" font-size="13" font-weight="700" fill="#065f46">Cost of this path</text>
  <text x="786" y="462" font-size="12.5" fill="#0f172a">0 screenshots</text>
  <text x="786" y="482" font-size="12.5" fill="#0f172a">≈ 600 text tokens</text>
  <text x="786" y="502" font-size="12.5" fill="#0f172a">3 calls (snapshot + 2)</text>
  <text x="786" y="520" font-size="11.5" fill="#475569">Long walks run on Sonnet</text>
  <text x="786" y="535" font-size="11.5" fill="#475569">in mobile-runner.</text>
  <text x="786" y="558" font-size="11.5" fill="#065f46">Next time: replay.sh runs</text>
  <text x="786" y="573" font-size="11.5" fill="#065f46">the saved flow in 1 call,</text>
  <text x="786" y="588" font-size="11.5" fill="#065f46">no model per step.</text>

  <text x="30" y="634" font-size="11.5" fill="#64748b">Illustrative. Sizes from the benchmark: a phone screenshot ≈ 3,300 input tokens; an accessibility snapshot is a few hundred. The app is fictional.</text>
</svg>
